<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spam Mail Detector</title>
<style>
  :root { --bg:#f5f6fa; --card:#fff; --text:#1c1f2a; --muted:#6b7280; --ok:#16a34a; --bad:#dc2626; --accent:#4f46e5; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1117; --card:#1a1d27; --text:#e5e7eb; --muted:#9ca3af; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text);
         display:flex; justify-content:center; padding:40px 16px; }
  main { width:100%; max-width:640px; background:var(--card); padding:28px; border-radius:16px;
         box-shadow:0 4px 24px rgba(0,0,0,.08); }
  h1 { margin:0 0 4px; font-size:1.6rem; }
  p.sub { margin:0 0 20px; color:var(--muted); }
  textarea { width:100%; height:180px; padding:12px; border-radius:10px; border:1px solid var(--muted);
             background:transparent; color:inherit; font:inherit; resize:vertical; }
  button { margin-top:12px; padding:10px 22px; border:0; border-radius:10px; background:var(--accent);
           color:#fff; font-size:1rem; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  #result { margin-top:20px; display:none; }
  .badge { display:inline-block; padding:6px 14px; border-radius:999px; font-weight:700; color:#fff; }
  .spam { background:var(--bad); } .ham { background:var(--ok); }
  .bar { height:10px; border-radius:999px; background:var(--muted); opacity:.9; margin-top:12px; overflow:hidden; }
  .fill { height:100%; background:var(--bad); width:0; transition:width .4s; }
  #err { color:var(--bad); margin-top:12px; }
</style>
</head>
<body>
<main>
  <h1>Spam Mail Detector</h1>
  <p class="sub">Paste an email or SMS and the ML model will classify it.</p>
  <textarea id="text" placeholder="Paste message here..."></textarea>
  <button id="btn">Check message</button>
  <div id="err"></div>
  <div id="result">
    <span id="badge" class="badge"></span>
    <span id="prob" style="margin-left:10px"></span>
    <div class="bar"><div id="fill" class="fill"></div></div>
  </div>
</main>
<script>
const btn = document.getElementById("btn");
btn.addEventListener("click", async () => {
  const text = document.getElementById("text").value;
  const err = document.getElementById("err");
  const result = document.getElementById("result");
  err.textContent = ""; result.style.display = "none";
  btn.disabled = true;
  try {
    const res = await fetch("/api/predict", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({text})
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Request failed");
    const badge = document.getElementById("badge");
    badge.textContent = data.label.toUpperCase();
    badge.className = "badge " + data.label;
    document.getElementById("prob").textContent =
      "Spam probability: " + (data.spam_probability * 100).toFixed(1) + "%";
    document.getElementById("fill").style.width = (data.spam_probability * 100) + "%";
    result.style.display = "block";
  } catch (e) { err.textContent = e.message; }
  btn.disabled = false;
});
</script>
</body>
</html>
